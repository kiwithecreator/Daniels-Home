<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6E7D8"/>
      <stop offset="100%" stop-color="#EED5C0"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="944" height="944" rx="220" fill="url(#bg)"/>

  <!-- coin -->
  <circle cx="790" cy="790" r="115" fill="#FFD66B" stroke="#E0B84F" stroke-width="18"/>
  <text x="790" y="825" font-size="140" text-anchor="middle" fill="#9A6A00" font-family="Arial">$</text>

  <!-- poodle ears -->
  <circle cx="315" cy="420" r="95" fill="#B86B3D"/>
  <circle cx="709" cy="420" r="95" fill="#B86B3D"/>

  <!-- head -->
  <circle cx="512" cy="430" r="185" fill="#C97A47"/>

  <!-- fluffy top -->
  <circle cx="430" cy="275" r="60" fill="#C97A47"/>
  <circle cx="512" cy="245" r="70" fill="#C97A47"/>
  <circle cx="594" cy="275" r="60" fill="#C97A47"/>

  <!-- eyes -->
  <circle cx="445" cy="420" r="22" fill="#2B1A12"/>
  <circle cx="579" cy="420" r="22" fill="#2B1A12"/>
  <circle cx="452" cy="412" r="7" fill="white"/>
  <circle cx="586" cy="412" r="7" fill="white"/>

  <!-- nose -->
  <ellipse cx="512" cy="500" rx="34" ry="24" fill="#2B1A12"/>

  <!-- smile -->
  <path d="M470 545 Q512 585 554 545" fill="none" stroke="#2B1A12" stroke-width="10" stroke-linecap="round"/>

  <!-- tiny heart -->
  <path d="M230 245
           C230 205 285 205 285 245
           C285 205 340 205 340 245
           C340 285 285 325 285 325
           C285 325 230 285 230 245Z"
        fill="#F28AA5"/>
</svg>